<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kartu Pos Cinta Simple</title>
    <!-- Romantic & Minimalist Typography -->
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-color: #faf6f4;
        --card-bg: #ffffff;
        --text-color: #4a3b32;
        --text-muted: #8c7a6e;
        --accent-color: #c97a7e;
        --accent-hover: #b36569;
        --border-color: #e8ded8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: var(--bg-color);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 30px 20px;
        color: var(--text-color);
      }

      .header {
        text-align: center;
        margin-bottom: 28px;
      }

      h1 {
        font-family: "Playfair Display", serif;
        font-weight: 500;
        font-size: 1.8rem;
        color: var(--text-color);
        margin: 0 0 6px 0;
      }

      .subtitle {
        font-size: 0.9rem;
        color: var(--text-muted);
        margin: 0;
      }

      .container {
        display: flex;
        gap: 36px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 1000px;
        width: 100%;
      }

      /* Form Controls */
      .controls {
        background: #ffffff;
        padding: 24px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        width: 340px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-height: 85vh;
        overflow-y: auto;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      label {
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--text-color);
      }

      input,
      textarea,
      select {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 0.88rem;
        color: var(--text-color);
        background-color: #faf9f8;
        transition: border-color 0.2s, background-color 0.2s;
      }

      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: var(--accent-color);
        background-color: #ffffff;
      }

      .photo-control-card {
        background: #faf7f5;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .photo-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.82rem;
        font-weight: 600;
      }

      .btn-del {
        background: none;
        border: none;
        color: #d9534f;
        cursor: pointer;
        font-size: 0.78rem;
        font-weight: 600;
        padding: 0;
      }

      button {
        border: 1px solid var(--accent-color);
        background-color: var(--accent-color);
        color: white;
        padding: 11px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.88rem;
        transition: background-color 0.2s, border-color 0.2s;
      }

      button:hover {
        background-color: var(--accent-hover);
        border-color: var(--accent-hover);
      }

      button.btn-add {
        background-color: #f5ebe6;
        color: var(--text-color);
        border: 1px dashed var(--accent-color);
        padding: 8px 12px;
        font-size: 0.82rem;
      }

      button.btn-add:hover {
        background-color: #ebdcd5;
      }

      /* Postcard Preview */
      .postcard-wrapper {
        display: flex;
        justify-content: center;
        width: 100%;
        max-width: 580px;
      }

      .postcard {
        width: 100%;
        max-width: 580px;
        min-height: 380px;
        background-color: var(--card-bg);
        border-radius: 8px;
        border: 1px solid var(--border-color);
        overflow: hidden;
        display: flex;
      }

      /* Left Side: Photo Container */
      .left-side {
        width: 52%;
        background-color: #f7f3f0;
        border-right: 1px solid var(--border-color);
        display: flex;
        position: relative;
        overflow: hidden;
      }

      .photo-grid {
        width: 100%;
        height: 100%;
        display: flex;
      }

      /* Photo Item Grid Layouts */
      .photo-grid.count-1 {
        flex-direction: column;
      }
      .photo-grid.count-1 .photo-item {
        width: 100%;
        height: 100%;
      }

      .photo-grid.count-2 {
        flex-direction: row;
      }
      .photo-grid.count-2 .photo-item {
        width: 50%;
        height: 100%;
        border-right: 1px solid var(--border-color);
      }
      .photo-grid.count-2 .photo-item:last-child {
        border-right: none;
      }

      .photo-grid.count-3 {
        flex-direction: column;
      }
      .photo-grid.count-3 .photo-item {
        width: 100%;
        height: 33.33%;
        border-bottom: 1px solid var(--border-color);
      }
      .photo-grid.count-3 .photo-item:last-child {
        border-bottom: none;
      }

      .photo-grid.count-4 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
      }
      .photo-grid.count-4 .photo-item {
        width: 100%;
        height: 100%;
        border-right: 1px solid var(--border-color);
        border-bottom: 1px solid var(--border-color);
      }

      .photo-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Right Side: Postcard Content */
      .right-side {
        width: 48%;
        padding: 24px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background-color: #fffdfb;
      }

      .stamp-area {
        display: flex;
        justify-content: flex-end;
      }

      /* Simple & Elegant Stamp */
      .stamp {
        width: 50px;
        height: 60px;
        border: 1px dashed var(--accent-color);
        border-radius: 4px;
        background-color: #fcf8f6;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--accent-color);
      }

      .stamp-icon {
        font-size: 1.1rem;
        margin-bottom: 2px;
      }

      .stamp-text {
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .message-area {
        font-family: "Caveat", cursive;
        font-size: 1.45rem;
        line-height: 1.4;
        color: #3b2d25;
        white-space: pre-wrap;
        flex-grow: 1;
        margin-top: 14px;
        margin-bottom: 14px;
        word-break: break-word;
      }

      .address-area {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 0.85rem;
        color: var(--text-color);
        border-top: 1px solid var(--border-color);
        padding-top: 12px;
        line-height: 1.4;
      }

      .address-area strong {
        color: var(--accent-color);
      }

      /* Responsive Adjustments */
      @media (max-width: 768px) {
        .container {
          gap: 24px;
        }

        .controls {
          width: 100%;
          max-width: 580px;
          padding: 20px;
          max-height: none;
        }

        .postcard {
          flex-direction: column;
          min-height: auto;
        }

        .left-side {
          width: 100%;
          height: 240px;
          border-right: none;
          border-bottom: 1px solid var(--border-color);
        }

        .right-side {
          width: 100%;
          padding: 20px;
          min-height: 250px;
        }

        .message-area {
          font-size: 1.35rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Kartu Pos Cinta</h1>
      <p class="subtitle">Desain simpel, bersih, & manis</p>
    </div>

    <div class="container">
      <!-- Controls -->
      <div class="controls">
        <label>Kelola Foto (1 - 4 Foto)</label>
        <div id="photosList" style="display: flex; flex-direction: column; gap: 10px;">
          <!-- Rendered dynamically -->
        </div>

        <button class="btn-add" onclick="addPhoto()">+ Tambah Foto</button>

        <div class="form-group" style="margin-top: 8px;">
          <label for="msgInput">Pesan Cinta</label>
          <textarea
            id="msgInput"
            rows="3"
            placeholder="Tulis pesan manis kamu..."
            oninput="updateText()"
          >Setiap detik bersamamu terasa begitu berarti. Terima kasih sudah selalu ada. ❤️</textarea>
        </div>

        <div class="form-group">
          <label for="nameInput">Untuk Seseorang</label>
          <input 
            type="text" 
            id="nameInput" 
            placeholder="Nama penerima..." 
            value="Kamu yang Spesial" 
            oninput="updateText()"
          />
        </div>

        <div class="form-group">
          <label for="fontSelect">Gaya Tulisan Pesan</label>
          <select id="fontSelect" onchange="updateText()">
            <option value="'Caveat', cursive">Tulisan Tangan (Caveat)</option>
            <option value="'Playfair Display', serif">Anggun & Klasik (Playfair)</option>
            <option value="'Plus Jakarta Sans', sans-serif">Simpel Modern (Jakarta Sans)</option>
          </select>
        </div>

        <button onclick="downloadPostcard()">Unduh Gambar Kartu Pos</button>
      </div>

      <!-- Preview -->
      <div class="postcard-wrapper">
        <div class="postcard" id="postcard">
          <div class="left-side">
            <div class="photo-grid count-2" id="photoGrid">
              <!-- Rendered photos -->
            </div>
          </div>
          <div class="right-side">
            <div class="stamp-area">
              <div class="stamp">
                <span class="stamp-icon">♥</span>
                <span class="stamp-text">CINTA</span>
              </div>
            </div>
            <div class="message-area" id="cardMessage">
Setiap detik bersamamu terasa begitu berarti. Terima kasih sudah selalu ada. ❤️
            </div>
            <div class="address-area">
              <strong>Untuk:</strong> <span id="cardName">Kamu yang Spesial</span><br />
              <span style="color: var(--text-muted); font-size: 0.8rem;">Di Mana Pun Kamu Berada</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script>
      let photoList = [
        "https://images.unsplash.com/photo-1518199266791-5375a83190b7?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
        "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
      ];

      function renderPhotoInputs() {
        const container = document.getElementById("photosList");
        container.innerHTML = "";

        photoList.forEach((src, idx) => {
          const card = document.createElement("div");
          card.className = "photo-control-card";
          card.innerHTML = `
            <div class="photo-card-header">
              <span>Foto #${idx + 1}</span>
              ${photoList.length > 1 ? `<button class="btn-del" onclick="deletePhoto(${idx})">Hapus</button>` : ''}
            </div>
            <input type="text" placeholder="URL Foto..." value="${src.startsWith('data:') ? '[File Uploaded]' : src}" oninput="updatePhotoUrl(${idx}, this.value)">
            <input type="file" accept="image/*" onchange="uploadPhoto(event, ${idx})">
          `;
          container.appendChild(card);
        });
      }

      function addPhoto() {
        if (photoList.length >= 4) {
          alert("Maksimal 4 foto.");
          return;
        }
        photoList.push("https://images.unsplash.com/photo-1522673607200-164d1b6ce486?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80");
        renderPhotoInputs();
        renderPhotoGrid();
      }

      function deletePhoto(idx) {
        if (photoList.length <= 1) return;
        photoList.splice(idx, 1);
        renderPhotoInputs();
        renderPhotoGrid();
      }

      function updatePhotoUrl(idx, val) {
        if (!val.startsWith('[File Uploaded]')) {
          photoList[idx] = val;
          renderPhotoGrid();
        }
      }

      function uploadPhoto(event, idx) {
        const file = event.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(e) {
            photoList[idx] = e.target.result;
            renderPhotoInputs();
            renderPhotoGrid();
          };
          reader.readAsDataURL(file);
        }
      }

      function renderPhotoGrid() {
        const grid = document.getElementById("photoGrid");
        grid.innerHTML = "";

        const count = photoList.length;
        grid.className = `photo-grid count-${count}`;

        photoList.forEach((src) => {
          const item = document.createElement("div");
          item.className = "photo-item";

          const img = document.createElement("img");
          img.crossOrigin = "anonymous";
          img.src = src;
          img.alt = "Foto Postcard";
          img.onerror = function() {
            this.onerror = null;
            this.src = "https://images.unsplash.com/photo-1518199266791-5375a83190b7?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80";
          };

          item.appendChild(img);
          grid.appendChild(item);
        });
      }

      function updateText() {
        const msg = document.getElementById("msgInput").value;
        const name = document.getElementById("nameInput").value;
        const font = document.getElementById("fontSelect").value;

        document.getElementById("cardMessage").innerText = msg;
        document.getElementById("cardMessage").style.fontFamily = font;
        document.getElementById("cardName").innerText = name || "Kamu yang Spesial";
      }

      function downloadPostcard() {
        const postcard = document.getElementById("postcard");
        const btn = document.querySelector(".controls button:last-child");
        const originalText = btn.innerText;
        btn.innerText = "Mengunduh...";
        btn.disabled = true;

        html2canvas(postcard, {
          useCORS: true,
          allowTaint: true,
          scale: 2,
          logging: false
        }).then((canvas) => {
          const link = document.createElement("a");
          link.download = "kartu-pos-cinta-simple.png";
          link.href = canvas.toDataURL("image/png");
          link.click();
          btn.innerText = originalText;
          btn.disabled = false;
        }).catch((err) => {
          console.error("Gagal membuat gambar:", err);
          alert("Gagal mengunduh gambar. Silakan coba lagi.");
          btn.innerText = originalText;
          btn.disabled = false;
        });
      }

      // Render awal
      renderPhotoInputs();
      renderPhotoGrid();
      updateText();
    </script>
  </body>
</html>
