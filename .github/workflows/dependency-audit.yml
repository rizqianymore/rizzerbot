name: "Supply Chain & Security Audit"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Verify Bun Lockfile Integrity
      run: |
        if [ ! -f bun.lock ] && [ ! -f bun.lockb ]; then
          echo "Error: bun.lock is missing! Supply chain checks require a committed lockfile."
          exit 1
        fi

    - name: Install dependencies with Bun
      run: bun install --frozen-lockfile

    - name: Validate Core Loading
      run: bun -e "import('./src/core/loader.js').then(m => m.loadPlugins()).then(() => console.log('All plugins loaded successfully in CI!'));"
